<html>

<head>
    <title>Class 13 demo</title>

    <meta name="viewport" content="width=device-width" />

</head>

<link rel="stylesheet" href="style.css">

<body>

    <p>
        this is a paragraph
    </p>
    <p>
        this is another paragraph
    </p>

    <!-- no spaces in class name -->
    <p class="blue">
        this is a blue paragraph
    </p>

    <h1 class="blue">
        this is a blue heading
    </h1>

    <span class="big purple">
        this a big purple span
    </span>
    <span class="purple">
        this a purple span
    </span>
    <span class="big">
        this a big span
    </span>

    <p id="important">
        this is a important paragraph!
    </p>

</body>

</html>
